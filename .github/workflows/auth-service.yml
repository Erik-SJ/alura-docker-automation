name: Tests - Burguer App/Auth Service

on:
  push:
    branches: [ "release" ]
   
  pull_request:
    branches: [ "release" ]
   
jobs:
  test-burguer-app-auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: burguer-app/auth-service

    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Configuring Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.4'

    - name: 📚 Install auth-service dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: 🧪 Run tests with coverage
      run: |
        pytest --cov=. --cov-report=term-missing --cov-branch --cov-fail-under=65
