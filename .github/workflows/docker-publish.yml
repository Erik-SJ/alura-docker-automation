name: Build and Publish Docker Images

on:
  push:
    branches:
        - docker-publish
    
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker images
        run: |
          docker build -t esjacob/auth-service:alura1.3 ./burguer-app/auth-service
          docker build -t esjacob/user-service:alura1.0 ./burguer-app/user-service
          # docker build -t product-service:alura1.0 ./burguer-app/product-service
          # docker build -t order-service:alura1.0 ./burguer-app/order-service
          docker image ls

      - name: Push Docker images to Docker Hub
        run: |
          docker push esjacob/auth-service:alura1.3
          docker push esjacob/user-service:alura1.0
          # docker push ${{ secrets.DOCKER_USERNAME }}/esjacob/auth-service:alura1.0
          # docker push your-username/my-repo:v1.0
       
