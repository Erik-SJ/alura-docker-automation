name: Build and Publish Docker Images

on:
  push:
    branches:
        - docker-publish
    
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # - name: Build Docker images
      
      #   run: |
      #     docker build -t auth-service:img-alura-git-1.0 ./burguer-app/auth-service
      #     docker build -t user-service:img-alura-git-1.0 ./burguer-app/user-service
      #     docker build -t product-service:img-alura-git-1.0 ./burguer-app/product-service
      #     docker build -t order-service:img-alura-git-1.0 ./burguer-app/order-service
      #     docker image ls

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker images
        run: |
          docker build -t auth-service:alura1.0 ./burguer-app/auth-service
          docker build -t user-service:alura1.0 ./burguer-app/user-service
          docker build -t product-service:alura1.0 ./burguer-app/product-service
          docker build -t order-service:alura1.0 ./burguer-app/order-service
          docker image ls

      - name: Push Docker images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/esjacob:alura1.0
       
          # docker push auth-service:alura1.0
          # docker push user-service:alura1.0
          # docker push product-service:alura1.0
          # docker push order-service:alura1.0
          #docker push your-username/my-repo:v1.0
       
