     - name: List Docker Images
       run: docker images

     - name: Push Docker images to Docker Hub
       run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/order-service:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/product-service:${{ env.IMAGE_TAG }}   

     # *** ROLLBACK ***
     - name: Rollback to Previous Version
       working-directory: burguer-app
       #if: failure()
       run: |
        echo "Rollback Automático"

        for service in auth-service user-service order-service product-service; do
         PREV_TAG=$(docker images docker/${{ secrets.DOCKER_USERNAME }}/$service --format "{{.Tag}}" | grep -v latest | head -n 2)

         if [ -z "$PREV_TAG" ]; then
           echo "No previous image found for $service, skipping rollback."
         else
           docker tag docker/${{ secrets.DOCKER_USERNAME }}/$service:${{ env.IMAGE_TAG }} docker/${{ secrets.DOCKER_USERNAME }}/auth-service:${PREV_TAG}
           echo "Rolled back docker/${{ secrets.DOCKER_USERNAME }}/$service:${{ env.IMAGE_TAG }} to tag $PREV_TAG"
         fi 
        done

