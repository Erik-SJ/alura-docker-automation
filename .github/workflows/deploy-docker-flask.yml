name: Docker Flask Workflow

on:
  push:
    branches:
      - docker-compose-flask

jobs:
  deploy-docker:
    runs-on: ubuntu-latest
    steps:
      # Clonar o repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Instalar Docker Compose
      - name: Install Docker Compose
        run: |
          if ! command -v docker-compose &> /dev/null; then
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          docker-compose --version

          # https://github.com/docker/compose/releases/tag/v5.0.2

      # Subir containers
      - name: Run Docker Compose
        run: |
          docker compose -f docker-flask/compose.yaml up --build -d
          docker ps -a

      # # Testar os serviços
      # - name: Test App Flask
      #   working-directory: docker-flask
      #   run: |
      #     pip install -r requirements.txt
      #     pytest -v

      # Parar containers ao final
      - name: Shut down containers
        run: docker compose -f docker-flask/compose.yaml down