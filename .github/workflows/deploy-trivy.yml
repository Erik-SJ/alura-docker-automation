name: Deploy Docker with Trivy Workflow

on:
  push:
    branches: [ docker-trivy ]

jobs: 

   docker-deploy:

     runs-on: ubuntu-latest

     steps:
     - name: Checkout Repository
       uses: actions/checkout@v3

     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v2

     - name: Log in to Docker Hub
       uses: docker/login-action@v2
       with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}  
    
     - name: Install Docker Compose
       run: |
        if ! command -v docker-compose &> /dev/null
        then
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version
        fi

     - name: Build Docker images
       run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/auth-service:trivy-2.0 ./burguer-app/auth-service
          # docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:trivy-2.0 ./burguer-app/user-service
          # docker build -t ${{ secrets.DOCKER_USERNAME }}/order-service:trivy-2.0 ./burguer-app/order-service
          # docker build -t ${{ secrets.DOCKER_USERNAME }}/product-service:trivy-.0 ./burguer-app/product-service
        
          docker image ls   
    
    #  - name: Install Trivy
    #    run: |
    #     sudo apt-get update
    #     sudo apt-get install -y wget
    #     wget https://github.com/aquasecurity/trivy/releases/download/v0.66.0/trivy_0.66.0_Linux-64bit.deb
    #     sudo dpkg -i trivy_0.66.0_Linux-64bit.deb

     - name: Check for Vulnerabilities with Trivy

       uses: aquasecurity/trivy-action@master
       with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/auth-service:trivy-2.0
          version: 'latest'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'MEDIUM'
          ignore-unfixed: true 
          exit-code: 1 # Bloqueia caso haja vulnerabilidades
          #exit-code: 0 # Bypass caso haja vulnerabilidades

    #  - name: Scan auth-service image
    #    run: trivy image --severity HIGH,CRITICAL ${{ secrets.DOCKER_USERNAME }}/auth-service:trivy-1.0

    #  - name: Scan user-service image
    #    run: trivy image --severity HIGH,CRITICAL ${{ secrets.DOCKER_USERNAME }}/user-service:trivy-1.0

    #  - name: Scan order-service image
    #    run: trivy image --severity HIGH,CRITICAL ${{ secrets.DOCKER_USERNAME }}/order-service:trivy-1.0

    #  - name: Scan product-service image
    #    run: trivy image --severity HIGH,CRITICAL ${{ secrets.DOCKER_USERNAME }}/product-service:trivy-1.0

     - name: List Docker Images
       run: docker images

