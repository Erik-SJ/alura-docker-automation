name: Deploy Docker Workflow

on: 
   push: 
     branches: 
     - release

jobs:
  deploy-docker:
    runs-on: ubuntu-latest
    
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Auth-Service
        working-directory: docker-app
        run: docker build -t auth-service:0.1 . -f Dockerfile

      - name: Build Docker Order-Service
        working-directory: docker-app
        run: docker build -t order-service:0.1 . -f Dockerfile

      - name: Build Docker Product-Service
        working-directory: docker-app
        run: docker build -t product-service:0.1 . -f Dockerfile

      - name: Build Docker User-Service
        working-directory: docker-app
        run: docker build -t user-service:0.1 . -f Dockerfile

      - name: List Images
        run: docker images

      - name: List Containers
        run: docker ps -a




  