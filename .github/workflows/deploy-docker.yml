name: Deploy Docker Workflow

on: 
   push: 
     branches: 
     - release

jobs:
  deploy-docker:
    runs-on: ubuntu-latest
    
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Auth-Service
        working-directory: docker-app
        run: | 
          docker build -t auth-service:0.1 . -f Dockerfile
          docker run -d auth-service:0.1

      - name: Build Docker Order-Service
        working-directory: docker-app
        run: | 
          docker build -t order-service:0.1 . -f Dockerfile
          docker run -d order-service:0.1

      - name: Build Docker Product-Service
        working-directory: docker-app
        run: | 
          docker build -t product-service:0.1 . -f Dockerfile
          docker run -d product-service:0.1

      - name: Build Docker User-Service
        working-directory: docker-app
        run: | 
          docker build -t user-service:0.1 . -f Dockerfile
          docker run -d user-service:0.1

      - name: List Images
        run: docker images

      - name: List Containers
        run: docker ps -a

  tests-apps:
    runs-on: ubuntu-latest
    needs: [deploy-docker]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Test App Auth-Service
        working-directory: burguer-app/auth-service
        run: |
          pip install -r requirements.txt
          pytest -v

      - name: Test App Order-Service
        working-directory: burguer-app/order-service
        run: |
          pip install -r requirements.txt
          pytest -v    

      - name: Test App Product-Service
        working-directory: burguer-app/product-service
        run: |
          pip install -r requirements.txt
          pytest -v

      - name: Test App User-Service
        working-directory: burguer-app/user-service
        run: |
          pip install -r requirements.txt
          pytest -v

  vulnerability-scan:
    runs-on: ubuntu-latest
    needs: [tests-apps]
    
    steps:
      
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.65.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.65.0_Linux-64bit.deb

      - name: Scan auth-service image with Trivy
        run: trivy image --severity HIGH,CRITICAL auth-service:0.1

      - name: Scan user-service image with Trivy
        run: trivy image --severity HIGH,CRITICAL user-service:0.1

      - name: Scan product-service image with Trivy
        run: trivy image --severity HIGH,CRITICAL product-service:0.1

      - name: Scan order-service image with Trivy
        run: trivy image --severity HIGH,CRITICAL order-service:0.1





  